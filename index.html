<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaheshStore - Premium Online Shopping</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fade-in-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-up { animation: fade-in-up 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icons ---
        const IconBase = ({ children, size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>);
        const ShoppingCart = (props) => <IconBase {...props}><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></IconBase>;
        const Search = (props) => <IconBase {...props}><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></IconBase>;
        const Menu = (props) => <IconBase {...props}><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></IconBase>;
        const X = (props) => <IconBase {...props}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></IconBase>;
        const Trash2 = (props) => <IconBase {...props}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></IconBase>;
        const Plus = (props) => <IconBase {...props}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></IconBase>;
        const Minus = (props) => <IconBase {...props}><line x1="5" y1="12" x2="19" y2="12"></line></IconBase>;
        const Star = (props) => <IconBase {...props}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></IconBase>;
        const ArrowRight = (props) => <IconBase {...props}><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></IconBase>;
        const CreditCard = (props) => <IconBase {...props}><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></IconBase>;
        const MapPin = (props) => <IconBase {...props}><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></IconBase>;
        const Mail = (props) => <IconBase {...props}><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></IconBase>;
        const User = (props) => <IconBase {...props}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></IconBase>;
        const CheckCircle = (props) => <IconBase {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></IconBase>;
        const LogIn = (props) => <IconBase {...props}><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></IconBase>;
        const UserPlus = (props) => <IconBase {...props}><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></IconBase>;
        const LogOut = (props) => <IconBase {...props}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></IconBase>;
        const Lock = (props) => <IconBase {...props}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></IconBase>;
        const Smartphone = (props) => <IconBase {...props}><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></IconBase>;
        const Banknote = (props) => <IconBase {...props}><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2"></circle><path d="M6 12h.01M18 12h.01"></path></IconBase>;
        const Users = (props) => <IconBase {...props}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></IconBase>;
        const ShoppingCardIcon = ({ className, size }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} width={size} height={size}>
                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
        );

        // --- Mock Data (Fallback) ---
        const PRODUCTS = [
            { id: 1, name: "Wireless Noise-Canceling Headphones", price: 24999, category: "Electronics", rating: 4.8, image_url: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&auto=format&fit=crop&q=60", description: "Premium sound quality with active noise cancellation and 30-hour battery life." },
            { id: 2, name: "Minimalist Analog Watch", price: 12499, category: "Fashion", rating: 4.5, image_url: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&auto=format&fit=crop&q=60", description: "Elegant design with a genuine leather strap and scratch-resistant glass." },
            { id: 3, name: "Ergonomic Office Chair", price: 16999, category: "Home", rating: 4.7, image_url: "https://images.unsplash.com/photo-1505843490538-5133c6c7d0e1?w=500&auto=format&fit=crop&q=60", description: "Designed for comfort with adjustable lumbar support and breathable mesh." },
            { id: 4, name: "Smart Fitness Tracker", price: 7499, category: "Electronics", rating: 4.3, image_url: "https://images.unsplash.com/photo-1575311373937-040b8e1fd5b6?w=500&auto=format&fit=crop&q=60", description: "Track your steps, heart rate, and sleep patterns with this waterproof device." },
            { id: 5, name: "Classic Denim Jacket", price: 6999, category: "Fashion", rating: 4.6, image_url: "https://images.unsplash.com/photo-1576871337622-98d48d1cf531?w=500&auto=format&fit=crop&q=60", description: "Vintage wash denim jacket, perfect for layering in any season." },
            { id: 6, name: "Ceramic Coffee Pour-Over Set", price: 3999, category: "Home", rating: 4.9, image_url: "https://images.unsplash.com/photo-1550989460-0adf9ea622e2?w=500&auto=format&fit=crop&q=60", description: "Handcrafted ceramic set for the perfect morning brew." },
            { id: 7, name: "4K Action Camera", price: 21999, category: "Electronics", rating: 4.4, image_url: "https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500&auto=format&fit=crop&q=60", description: "Capture your adventures in stunning 4K resolution. Waterproof and durable." },
            { id: 8, name: "Leather Weekend Bag", price: 14999, category: "Fashion", rating: 4.7, image_url: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500&auto=format&fit=crop&q=60", description: "Spacious and stylish, made from full-grain vegetable-tanned leather." },
            { id: 9, name: "Premium 5G Smartphone", price: 59999, category: "Electronics", rating: 4.9, image_url: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500&auto=format&fit=crop&q=60", description: "Latest generation 5G smartphone with pro-grade camera system and all-day battery." },
            { id: 10, name: "Running Performance Shoes", price: 4499, category: "Fashion", rating: 4.5, image_url: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&auto=format&fit=crop&q=60", description: "Lightweight, breathable mesh running shoes with superior cushioning support." },
            { id: 11, name: "Smart LED Desk Lamp", price: 2499, category: "Home", rating: 4.6, image_url: "https://images.unsplash.com/photo-1534234828563-025c27633c75?w=500&auto=format&fit=crop&q=60", description: "Adjustable color temperature and brightness with touch controls and USB charging." },
            { id: 12, name: "Portable Bluetooth Speaker", price: 3499, category: "Electronics", rating: 4.4, image_url: "https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=500&auto=format&fit=crop&q=60", description: "Waterproof portable speaker with 360-degree sound and 12-hour playtime." }
        ];

        const CATEGORIES = ["All", "Electronics", "Fashion", "Home"];

        // --- Helper Components ---
        const Button = ({ children, onClick, variant = "primary", className = "", icon: Icon, disabled }) => {
            const baseStyle = "flex items-center justify-center px-4 py-2 rounded-lg font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed";
            const variants = {
                primary: "bg-indigo-600 text-white hover:bg-indigo-700 focus:ring-indigo-500 shadow-sm",
                secondary: "bg-white text-gray-700 border border-gray-300 hover:bg-gray-50 focus:ring-gray-500",
                danger: "bg-red-50 text-red-600 hover:bg-red-100 focus:ring-red-500",
                ghost: "text-gray-500 hover:text-indigo-600 hover:bg-indigo-50"
            };
            return (
                <button onClick={onClick} disabled={disabled} className={`${baseStyle} ${variants[variant]} ${className}`}>
                    {Icon && <Icon size={18} className="mr-2" />}
                    {children}
                </button>
            );
        };

        const formatPrice = (price) => {
            const numPrice = typeof price === 'string' ? parseFloat(price) : price;
            return new Intl.NumberFormat('en-IN', {
                style: 'currency',
                currency: 'INR',
                maximumFractionDigits: 0
            }).format(numPrice);
        };

        // --- Main Application ---
        function App() {
            const [view, setView] = useState('home'); 
            const [cart, setCart] = useState([]);
            const [user, setUser] = useState(null); 
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('All');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [notification, setNotification] = useState(null);
            const [lastOrder, setLastOrder] = useState(null);
            const [paymentMethod, setPaymentMethod] = useState('upi');
            
            // State for Data
            const [products, setProducts] = useState([]);
            const [usersList, setUsersList] = useState([]); // Added for Admin
            const [loading, setLoading] = useState(true);

            // Fetch Products
            useEffect(() => {
                fetch('http://localhost:5000/api/products')
                    .then(res => {
                        if (!res.ok) throw new Error('Network response was not ok');
                        return res.json();
                    })
                    .then(data => {
                        setProducts(data);
                        setLoading(false);
                    })
                    .catch(err => {
                        console.warn("Backend server not reachable. Switching to offline demo mode.");
                        setProducts(PRODUCTS); 
                        setLoading(false);
                    });
            }, []);

            // Derived state
            const cartItemCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            const filteredProducts = products.filter(product => {
                const matchesSearch = product.name.toLowerCase().includes(searchQuery.toLowerCase());
                const matchesCategory = selectedCategory === 'All' || product.category === selectedCategory;
                return matchesSearch && matchesCategory;
            });

            // Actions
            const addToCart = (product) => {
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) {
                        return prev.map(item => 
                            item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item
                        );
                    }
                    return [...prev, { ...product, quantity: 1 }];
                });
                showNotification(`Added ${product.name} to cart`);
            };

            const updateQuantity = (id, delta) => {
                setCart(prev => prev.map(item => {
                    if (item.id === id) {
                        const newQty = Math.max(0, item.quantity + delta);
                        return { ...item, quantity: newQty };
                    }
                    return item;
                }).filter(item => item.quantity > 0));
            };

            const removeFromCart = (id) => {
                setCart(prev => prev.filter(item => item.id !== id));
            };

            const showNotification = (message) => {
                setNotification(message);
                setTimeout(() => setNotification(null), 3000);
            };

            const handleAdminView = () => {
                setView('admin-users');
                // Fetch users when entering admin view
                fetch('http://localhost:5000/api/users')
                    .then(res => res.json())
                    .then(data => setUsersList(data))
                    .catch(err => {
                        console.warn("Could not fetch users:", err);
                        // Mock users for offline
                        setUsersList([
                            { id: 1, full_name: "Mahesh User", email: "user@example.com", address: "123 Hyderabad St", created_at: "2024-01-01" },
                            { id: 2, full_name: "Test Customer", email: "test@example.com", address: "456 Warangal Rd", created_at: "2024-01-02" }
                        ]);
                    });
            };

            const handleCheckout = async (e) => {
                e.preventDefault();
                if (!user) {
                    showNotification("Please login to checkout");
                    setView('login');
                    return;
                }

                const formData = new FormData(e.target);
                const data = Object.fromEntries(formData.entries());
                const tax = cartTotal * 0.18; 
                const total = cartTotal + tax;
                const fullAddress = `${data.address}, ${data.city}, ${data.zip}`;

                let orderId = Math.floor(Math.random() * 10000); 
                
                try {
                    const response = await fetch('http://localhost:5000/api/orders', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            userId: 1, 
                            totalAmount: total,
                            shippingAddress: fullAddress,
                            paymentMethod: paymentMethod
                        })
                    });
                    
                    if (response.ok) {
                        const result = await response.json();
                        orderId = result.orderId;
                    } 
                } catch (error) {
                    console.warn("Backend offline. Order processed locally.");
                }

                setLastOrder({ id: orderId, total: total, email: user.email, paymentMethod: paymentMethod });

                // WhatsApp Message
                let message = `*New Order from MaheshStore*\nCustomer: ${data.firstName} ${data.lastName}\nEmail: ${data.email}\n\n*Items:*\n`;
                cart.forEach(item => {
                    message += `- ${item.name} (x${item.quantity}): ₹${(item.price * item.quantity).toLocaleString('en-IN')}\n`;
                });
                message += `\nSubtotal: ₹${cartTotal.toLocaleString('en-IN')}\nGST (18%): ₹${tax.toLocaleString('en-IN')}\n*Grand Total: ₹${total.toLocaleString('en-IN')}*\n`;
                const modeText = paymentMethod === 'cod' ? 'Cash on Delivery (COD)' : 'UPI (PhonePe / GPay)';
                message += `\n*Payment Mode:* ${modeText}\n*Shipping Address:*\n${fullAddress}`;

                window.open(`https://wa.me/919701952430?text=${encodeURIComponent(message)}`, '_blank');

                setView('success');
                setCart([]);
                window.scrollTo(0,0);
            };

            const handleLogin = (e) => {
                e.preventDefault();
                setTimeout(() => {
                    setUser({ name: "Mahesh User", email: "user@example.com" });
                    setView('home');
                    showNotification("Welcome back, Mahesh!");
                }, 500);
            };

            const handleSignup = (e) => {
                e.preventDefault();
                setTimeout(() => {
                    setUser({ name: "New User", email: "new@example.com" });
                    setView('home');
                    showNotification("Account created successfully!");
                }, 500);
            };

            const handleLogout = () => {
                setUser(null);
                setView('home');
                showNotification("Logged out successfully");
            };

            // --- Views ---

            const renderAdminUsers = () => (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                    <div className="flex items-center gap-2 mb-8">
                        <button onClick={() => setView('home')} className="text-gray-500 hover:text-indigo-600">
                            <ArrowRight className="rotate-180" size={24} />
                        </button>
                        <h2 className="text-3xl font-bold text-gray-900">Registered Users</h2>
                    </div>
                    
                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm text-gray-600">
                                <thead className="bg-gray-50 text-gray-900 font-semibold uppercase tracking-wider text-xs border-b border-gray-200">
                                    <tr>
                                        <th className="px-6 py-4">ID</th>
                                        <th className="px-6 py-4">Full Name</th>
                                        <th className="px-6 py-4">Email</th>
                                        <th className="px-6 py-4">Address</th>
                                        <th className="px-6 py-4">Joined</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-100">
                                    {usersList.length === 0 ? (
                                        <tr>
                                            <td colSpan="5" className="px-6 py-8 text-center text-gray-400">No users found</td>
                                        </tr>
                                    ) : (
                                        usersList.map((u) => (
                                            <tr key={u.id} className="hover:bg-gray-50 transition-colors">
                                                <td className="px-6 py-4 font-mono text-gray-400">#{u.id}</td>
                                                <td className="px-6 py-4 font-medium text-gray-900">{u.full_name}</td>
                                                <td className="px-6 py-4">{u.email}</td>
                                                <td className="px-6 py-4 truncate max-w-xs">{u.address || "N/A"}</td>
                                                <td className="px-6 py-4 text-gray-400">{u.created_at ? new Date(u.created_at).toLocaleDateString() : 'N/A'}</td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );

            const renderHome = () => (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                    <div className="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                        <div className="flex gap-2 overflow-x-auto pb-2 w-full md:w-auto no-scrollbar">
                            {CATEGORIES.map(cat => (
                                <button
                                    key={cat}
                                    onClick={() => setSelectedCategory(cat)}
                                    className={`px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-colors ${
                                        selectedCategory === cat 
                                        ? 'bg-indigo-600 text-white shadow-md' 
                                        : 'bg-white text-gray-600 hover:bg-gray-100 border border-gray-200'
                                    }`}
                                >
                                    {cat}
                                </button>
                            ))}
                        </div>
                        
                        <div className="relative w-full md:w-64 group">
                            <input
                                type="text"
                                placeholder="Search products..."
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                className="w-full pl-10 pr-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-shadow"
                            />
                            <Search className="absolute left-3 top-2.5 text-gray-400 group-focus-within:text-indigo-500" size={18} />
                        </div>
                    </div>

                    {loading ? (
                         <div className="text-center py-20 text-gray-500">
                            Loading products from server...
                        </div>
                    ) : filteredProducts.length === 0 ? (
                        <div className="text-center py-20">
                            <p className="text-gray-500 text-lg">No products found.</p>
                            <Button variant="ghost" onClick={() => {setSearchQuery(''); setSelectedCategory('All');}} className="mt-4">
                                Clear Filters
                            </Button>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                            {filteredProducts.map(product => (
                                <div key={product.id} className="bg-white rounded-xl shadow-sm hover:shadow-lg transition-all duration-300 overflow-hidden group border border-gray-100 flex flex-col">
                                    <div className="relative h-64 overflow-hidden bg-gray-100">
                                        <img 
                                            src={product.image_url || "https://via.placeholder.com/300"} 
                                            alt={product.name} 
                                            className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"
                                        />
                                        <div className="absolute top-3 right-3 bg-white/90 backdrop-blur-sm px-2 py-1 rounded-md flex items-center shadow-sm">
                                            <Star size={14} className="text-yellow-400 fill-yellow-400 mr-1" />
                                            <span className="text-xs font-bold text-gray-700">{product.rating}</span>
                                        </div>
                                    </div>
                                    
                                    <div className="p-5 flex flex-col flex-grow">
                                        <div className="text-xs font-medium text-indigo-600 mb-1">{product.category}</div>
                                        <h3 className="text-lg font-bold text-gray-900 mb-2 leading-tight">{product.name}</h3>
                                        <p className="text-gray-500 text-sm mb-4 line-clamp-2 flex-grow">{product.description}</p>
                                        
                                        <div className="flex items-center justify-between mt-auto pt-4 border-t border-gray-50">
                                            <span className="text-xl font-bold text-gray-900">{formatPrice(product.price)}</span>
                                            <button 
                                                onClick={() => addToCart(product)}
                                                className="p-2 rounded-full bg-gray-100 hover:bg-indigo-600 hover:text-white text-gray-600 transition-colors"
                                                aria-label="Add to cart"
                                            >
                                                <Plus size={20} />
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );

            const renderCart = () => (
                <div className="max-w-4xl mx-auto px-4 py-8">
                    <div className="flex items-center gap-2 mb-8">
                        <button onClick={() => setView('home')} className="text-gray-500 hover:text-indigo-600">
                            <ArrowRight className="rotate-180" size={24} />
                        </button>
                        <h2 className="text-3xl font-bold text-gray-900">Your Cart</h2>
                    </div>

                    {cart.length === 0 ? (
                        <div className="text-center py-16 bg-white rounded-2xl shadow-sm border border-gray-100">
                            <div className="bg-gray-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4">
                                <ShoppingCart size={40} className="text-gray-400" />
                            </div>
                            <p className="text-xl text-gray-600 mb-6">Your cart is empty</p>
                            <Button onClick={() => setView('home')}>Start Shopping</Button>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div className="lg:col-span-2 space-y-4">
                                {cart.map(item => (
                                    <div key={item.id} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex gap-4">
                                        <img src={item.image_url || "https://via.placeholder.com/150"} alt={item.name} className="w-24 h-24 object-cover rounded-lg bg-gray-100" />
                                        <div className="flex-grow flex flex-col justify-between">
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <h3 className="font-bold text-gray-900">{item.name}</h3>
                                                    <p className="text-sm text-gray-500">{item.category}</p>
                                                </div>
                                                <button onClick={() => removeFromCart(item.id)} className="text-gray-400 hover:text-red-500">
                                                    <Trash2 size={18} />
                                                </button>
                                            </div>
                                            
                                            <div className="flex justify-between items-center mt-4">
                                                <div className="flex items-center gap-3 bg-gray-50 rounded-lg p-1">
                                                    <button 
                                                        onClick={() => updateQuantity(item.id, -1)}
                                                        className="p-1 hover:bg-white rounded-md transition-shadow shadow-sm disabled:opacity-50"
                                                    >
                                                        <Minus size={14} />
                                                    </button>
                                                    <span className="text-sm font-bold w-4 text-center">{item.quantity}</span>
                                                    <button 
                                                        onClick={() => updateQuantity(item.id, 1)}
                                                        className="p-1 hover:bg-white rounded-md transition-shadow shadow-sm"
                                                    >
                                                        <Plus size={14} />
                                                    </button>
                                                </div>
                                                <span className="font-bold text-gray-900">{formatPrice(item.price * item.quantity)}</span>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            
                            <div className="lg:col-span-1">
                                <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 sticky top-24">
                                    <h3 className="text-lg font-bold text-gray-900 mb-4">Order Summary</h3>
                                    <div className="space-y-3 mb-6">
                                        <div className="flex justify-between text-gray-600">
                                            <span>Subtotal</span>
                                            <span>{formatPrice(cartTotal)}</span>
                                        </div>
                                        <div className="flex justify-between text-gray-600">
                                            <span>Shipping</span>
                                            <span className="text-green-600 font-medium">Free</span>
                                        </div>
                                        <div className="flex justify-between text-gray-600">
                                            <span>GST (18%)</span>
                                            <span>{formatPrice(cartTotal * 0.18)}</span>
                                        </div>
                                        <div className="h-px bg-gray-200 my-4"></div>
                                        <div className="flex justify-between text-xl font-bold text-gray-900">
                                            <span>Total</span>
                                            <span>{formatPrice(cartTotal * 1.18)}</span>
                                        </div>
                                    </div>
                                    <Button onClick={() => setView('checkout')} className="w-full py-3" icon={CreditCard}>
                                        Proceed to Checkout
                                    </Button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );

            const renderLogin = () => (
                <div className="flex flex-col items-center justify-center min-h-[80vh] px-4">
                    <div className="bg-white p-8 rounded-2xl shadow-lg border border-gray-100 w-full max-w-md animate-fade-in-up">
                        <div className="text-center mb-8">
                            <div className="bg-indigo-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                                <User size={32} className="text-indigo-600" />
                            </div>
                            <h2 className="text-2xl font-bold text-gray-900">Welcome Back</h2>
                            <p className="text-gray-500 text-sm mt-2">Sign in to your account to continue</p>
                        </div>
                        <form onSubmit={handleLogin} className="space-y-6">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                                <div className="relative">
                                    <input required type="email" className="w-full pl-10 pr-4 py-3 bg-gray-50 rounded-lg border border-transparent focus:bg-white focus:border-indigo-500 outline-none transition-all" placeholder="you@example.com" />
                                    <Mail className="absolute left-3 top-3.5 text-gray-400" size={18} />
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                <div className="relative">
                                    <input required type="password" className="w-full pl-10 pr-4 py-3 bg-gray-50 rounded-lg border border-transparent focus:bg-white focus:border-indigo-500 outline-none transition-all" placeholder="••••••••" />
                                    <div className="absolute left-3 top-3.5 text-gray-400">
                                        <Lock size={18} />
                                    </div>
                                </div>
                            </div>
                            <Button className="w-full py-3" icon={LogIn}>Sign In</Button>
                        </form>
                        <div className="mt-6 text-center text-sm text-gray-500">
                            Don't have an account? <button onClick={() => setView('signup')} className="text-indigo-600 font-medium hover:underline">Sign up</button>
                        </div>
                    </div>
                </div>
            );

            const renderSignup = () => (
                <div className="flex flex-col items-center justify-center min-h-[80vh] px-4">
                    <div className="bg-white p-8 rounded-2xl shadow-lg border border-gray-100 w-full max-w-md animate-fade-in-up">
                        <div className="text-center mb-8">
                            <div className="bg-indigo-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                                <UserPlus size={32} className="text-indigo-600" />
                            </div>
                            <h2 className="text-2xl font-bold text-gray-900">Create Account</h2>
                            <p className="text-gray-500 text-sm mt-2">Join MaheshStore today</p>
                        </div>
                        <form onSubmit={handleSignup} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                                <div className="relative">
                                    <input required type="text" className="w-full pl-10 pr-4 py-3 bg-gray-50 rounded-lg border border-transparent focus:bg-white focus:border-indigo-500 outline-none transition-all" placeholder="John Doe" />
                                    <User className="absolute left-3 top-3.5 text-gray-400" size={18} />
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                                <div className="relative">
                                    <input required type="email" className="w-full pl-10 pr-4 py-3 bg-gray-50 rounded-lg border border-transparent focus:bg-white focus:border-indigo-500 outline-none transition-all" placeholder="you@example.com" />
                                    <Mail className="absolute left-3 top-3.5 text-gray-400" size={18} />
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                <div className="relative">
                                    <input required type="password" className="w-full pl-10 pr-4 py-3 bg-gray-50 rounded-lg border border-transparent focus:bg-white focus:border-indigo-500 outline-none transition-all" placeholder="••••••••" />
                                    <div className="absolute left-3 top-3.5 text-gray-400">
                                        <Lock size={18} />
                                    </div>
                                </div>
                            </div>
                            <Button className="w-full py-3" icon={UserPlus}>Create Account</Button>
                        </form>
                        <div className="mt-6 text-center text-sm text-gray-500">
                            Already have an account? <button onClick={() => setView('login')} className="text-indigo-600 font-medium hover:underline">Sign in</button>
                        </div>
                    </div>
                </div>
            );

            const renderCheckout = () => (
                <div className="max-w-2xl mx-auto px-4 py-8">
                    <button onClick={() => setView('cart')} className="flex items-center text-gray-500 hover:text-indigo-600 mb-6">
                        <ArrowRight className="rotate-180 mr-2" size={20} /> Back to Cart
                    </button>
                
                    <div className="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
                        <h2 className="text-2xl font-bold text-gray-900 mb-6">Checkout</h2>
                        <form onSubmit={handleCheckout} className="space-y-6">
                            <div className="space-y-4">
                                <h3 className="text-sm font-semibold text-gray-500 uppercase tracking-wider flex items-center gap-2">
                                    <User size={16} /> Contact Information
                                </h3>
                                <div className="grid grid-cols-2 gap-4">
                                    <input required name="firstName" type="text" placeholder="First Name" defaultValue={user?.name?.split(' ')[0]} className="w-full p-3 bg-gray-50 rounded-lg border border-transparent focus:bg-white focus:border-indigo-500 outline-none transition-all" />
                                    <input required name="lastName" type="text" placeholder="Last Name" defaultValue={user?.name?.split(' ')[1]} className="w-full p-3 bg-gray-50 rounded-lg border border-transparent focus:bg-white focus:border-indigo-500 outline-none transition-all" />
                                </div>
                                <input required name="email" type="email" placeholder="Email Address" defaultValue={user?.email} className="w-full p-3 bg-gray-50 rounded-lg border border-transparent focus:bg-white focus:border-indigo-500 outline-none transition-all" />
                            </div>

                            <div className="space-y-4">
                                <h3 className="text-sm font-semibold text-gray-500 uppercase tracking-wider flex items-center gap-2">
                                    <MapPin size={16} /> Shipping Address
                                </h3>
                                <input required name="address" type="text" placeholder="Street Address" className="w-full p-3 bg-gray-50 rounded-lg border border-transparent focus:bg-white focus:border-indigo-500 outline-none transition-all" />
                                <div className="grid grid-cols-2 gap-4">
                                    <input required name="city" type="text" placeholder="City" className="w-full p-3 bg-gray-50 rounded-lg border border-transparent focus:bg-white focus:border-indigo-500 outline-none transition-all" />
                                    <input required name="zip" type="text" placeholder="Zip Code" className="w-full p-3 bg-gray-50 rounded-lg border border-transparent focus:bg-white focus:border-indigo-500 outline-none transition-all" />
                                </div>
                            </div>

                            <div className="space-y-4">
                                <h3 className="text-sm font-semibold text-gray-500 uppercase tracking-wider flex items-center gap-2">
                                    <Smartphone size={16} /> Payment Method
                                </h3>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <button 
                                        type="button" 
                                        onClick={() => setPaymentMethod('upi')}
                                        className={`p-4 border-2 rounded-lg flex flex-col items-center justify-center gap-2 transition-all cursor-pointer ${paymentMethod === 'upi' ? 'border-indigo-600 bg-indigo-50' : 'border-gray-200 hover:border-gray-300'}`}
                                    >
                                        <Smartphone size={24} className={paymentMethod === 'upi' ? 'text-indigo-600' : 'text-gray-400'} />
                                        <div className={`font-bold ${paymentMethod === 'upi' ? 'text-indigo-700' : 'text-gray-700'}`}>UPI Payment</div>
                                        <div className="text-xs text-gray-500 text-center">PhonePe, Google Pay</div>
                                    </button>

                                    <button 
                                        type="button" 
                                        onClick={() => setPaymentMethod('cod')}
                                        className={`p-4 border-2 rounded-lg flex flex-col items-center justify-center gap-2 transition-all cursor-pointer ${paymentMethod === 'cod' ? 'border-indigo-600 bg-indigo-50' : 'border-gray-200 hover:border-gray-300'}`}
                                    >
                                        <Banknote size={24} className={paymentMethod === 'cod' ? 'text-indigo-600' : 'text-gray-400'} />
                                        <div className={`font-bold ${paymentMethod === 'cod' ? 'text-indigo-700' : 'text-gray-700'}`}>Cash on Delivery</div>
                                        <div className="text-xs text-gray-500 text-center">Pay when you receive</div>
                                    </button>
                                </div>
                                
                                <div className="p-4 bg-yellow-50 text-yellow-800 text-sm rounded-lg border border-yellow-200">
                                    <p><strong>Note:</strong> Order details will be sent via WhatsApp. {paymentMethod === 'cod' ? 'Please keep exact change ready.' : 'You can pay using UPI after placing the order.'}</p>
                                </div>
                            </div>

                            <Button className="w-full py-4 text-lg mt-4">
                                Place Order {paymentMethod === 'upi' ? '& Pay' : ''} {formatPrice(cartTotal * 1.18)}
                            </Button>
                        </form>
                    </div>
                </div>
            );

            const renderSuccess = () => {
                const amount = lastOrder ? lastOrder.total.toFixed(2) : "0.00";
                const upiLink = `upi://pay?pa=9701952430@upi&pn=MaheshStore&am=${amount}&cu=INR`;
                const phonePeLink = `phonepe://pay?pa=9701952430@upi&pn=MaheshStore&am=${amount}&cu=INR`;
                const gpayLink = `tez://upi/pay?pa=9701952430@upi&pn=MaheshStore&am=${amount}&cu=INR`;
                const isCOD = lastOrder?.paymentMethod === 'cod';

                return (
                    <div className="flex flex-col items-center justify-center min-h-[60vh] px-4 text-center">
                        <div className="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mb-6 animate-bounce">
                            <CheckCircle size={48} className="text-green-600" />
                        </div>
                        <h2 className="text-3xl font-bold text-gray-900 mb-4">Order Placed Successfully!</h2>
                        <p className="text-gray-600 max-w-md mb-8">
                            Thank you for your purchase. We have sent the order details to your WhatsApp. Your order ID is <span className="font-mono font-bold">#ORD-{lastOrder?.id}</span>.
                        </p>

                        {!isCOD ? (
                            <div className="w-full max-w-sm space-y-3">
                                <h3 className="text-lg font-semibold text-gray-800 mb-2">Complete Payment</h3>
                                
                                <a href={phonePeLink} className="flex items-center justify-center w-full py-3 bg-[#5f259f] text-white rounded-lg font-bold hover:opacity-90 transition-opacity">
                                    Pay with PhonePe
                                </a>
                                
                                <a href={gpayLink} className="flex items-center justify-center w-full py-3 bg-white border border-gray-300 text-gray-700 rounded-lg font-bold hover:bg-gray-50 transition-colors">
                                    <span className="flex items-center"><span className="text-blue-500">G</span><span className="text-red-500">o</span><span className="text-yellow-500">o</span><span className="text-blue-500">g</span><span className="text-green-500">l</span><span className="text-red-500">e</span>&nbsp;Pay</span>
                                </a>

                                <a href={upiLink} className="flex items-center justify-center w-full py-3 bg-indigo-600 text-white rounded-lg font-bold hover:bg-indigo-700 transition-colors mt-2">
                                    Pay with Other UPI App
                                </a>
                                
                                <p className="text-xs text-gray-400 mt-2">
                                    *Links will open the respective apps on your mobile device.
                                </p>
                            </div>
                        ) : (
                            <div className="w-full max-w-sm bg-indigo-50 p-6 rounded-xl border border-indigo-100 mt-2">
                                <h3 className="font-bold text-indigo-900 mb-2 flex items-center justify-center gap-2">
                                    <Banknote size={20} /> Cash on Delivery
                                </h3>
                                <p className="text-indigo-700 text-sm">
                                    Your order is confirmed. Please pay <span className="font-bold text-xl block mt-1">{formatPrice(lastOrder?.total)}</span> to the delivery agent upon arrival.
                                </p>
                            </div>
                        )}
                        
                        <Button variant="ghost" onClick={() => setView('home')} className="mt-8">Continue Shopping</Button>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-gray-50 font-sans text-gray-900">
                    <nav className="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-200">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between items-center h-16">
                                <div className="flex items-center cursor-pointer" onClick={() => setView('home')}>
                                    <div className="bg-indigo-600 p-2 rounded-lg mr-2">
                                        <ShoppingCardIcon className="text-white" size={20} />
                                    </div>
                                    <span className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600">
                                        MaheshStore
                                    </span>
                                </div>

                                <div className="hidden md:flex items-center space-x-8">
                                    <button onClick={() => setView('home')} className={`text-sm font-medium transition-colors ${view === 'home' ? 'text-indigo-600' : 'text-gray-500 hover:text-gray-900'}`}>Shop</button>
                                    <button onClick={handleAdminView} className={`text-sm font-medium transition-colors ${view === 'admin-users' ? 'text-indigo-600' : 'text-gray-500 hover:text-gray-900'}`}>Admin</button>
                                </div>

                                <div className="flex items-center gap-4">
                                    {user ? (
                                        <div className="hidden md:flex items-center gap-4">
                                            <span className="text-sm font-medium text-gray-700">Hi, {user.name.split(' ')[0]}</span>
                                            <button onClick={handleLogout} className="text-gray-500 hover:text-red-600 transition-colors" title="Logout">
                                                <LogOut size={20} />
                                            </button>
                                        </div>
                                    ) : (
                                        <button onClick={() => setView('login')} className="hidden md:block text-sm font-medium text-gray-700 hover:text-indigo-600 transition-colors">
                                            Login
                                        </button>
                                    )}

                                    <button 
                                        onClick={() => setView('cart')} 
                                        className="relative p-2 text-gray-500 hover:text-indigo-600 transition-colors"
                                        aria-label="Cart"
                                    >
                                        <ShoppingCart size={24} />
                                        {cartItemCount > 0 && (
                                            <span className="absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white transform translate-x-1/4 -translate-y-1/4 bg-red-500 rounded-full border-2 border-white">
                                                {cartItemCount}
                                            </span>
                                        )}
                                    </button>
                                    
                                    <button 
                                        className="md:hidden p-2 text-gray-500"
                                        onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}
                                    >
                                        {isMobileMenuOpen ? <X size={24} /> : <Menu size={24} />}
                                    </button>
                                </div>
                            </div>
                        </div>

                        {isMobileMenuOpen && (
                            <div className="md:hidden bg-white border-b border-gray-200 px-4 pt-2 pb-4 space-y-1 shadow-lg absolute w-full left-0 top-16">
                                <button onClick={() => { setView('home'); setIsMobileMenuOpen(false); }} className="block w-full text-left px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-indigo-600 hover:bg-gray-50">Shop</button>
                                <button onClick={() => { handleAdminView(); setIsMobileMenuOpen(false); }} className="block w-full text-left px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-indigo-600 hover:bg-gray-50">Admin</button>
                                {!user && <button onClick={() => { setView('login'); setIsMobileMenuOpen(false); }} className="block w-full text-left px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-indigo-600 hover:bg-gray-50">Login</button>}
                                {user && <button onClick={() => { handleLogout(); setIsMobileMenuOpen(false); }} className="block w-full text-left px-3 py-2 rounded-md text-base font-medium text-red-600 hover:bg-gray-50">Logout ({user.name})</button>}
                            </div>
                        )}
                    </nav>

                    <main className="pt-4 pb-12">
                        {view === 'home' && renderHome()}
                        {view === 'cart' && renderCart()}
                        {view === 'checkout' && renderCheckout()}
                        {view === 'success' && renderSuccess()}
                        {view === 'login' && renderLogin()}
                        {view === 'signup' && renderSignup()}
                        {view === 'admin-users' && renderAdminUsers()}
                    </main>

                    <footer className="bg-white border-t border-gray-200 mt-auto">
                        <div className="max-w-7xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
                            <div className="flex flex-col md:flex-row justify-between items-center">
                                <div className="flex items-center mb-4 md:mb-0">
                                    <div className="bg-gray-200 p-1.5 rounded-md mr-2">
                                        <ShoppingCardIcon className="text-gray-500" size={16} />
                                    </div>
                                    <span className="text-lg font-bold text-gray-800">MaheshStore</span>
                                </div>
                                <p className="text-gray-500 text-sm">© 2024 MaheshStore Inc. All rights reserved.</p>
                            </div>
                        </div>
                    </footer>

                    {notification && (
                        <div className="fixed bottom-4 right-4 bg-gray-900 text-white px-6 py-3 rounded-lg shadow-xl flex items-center animate-fade-in-up z-50">
                            <CheckCircle size={18} className="text-green-400 mr-2" />
                            {notification}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
